[project]
name = "orders-api"
version = "0.1.0"
description = "An API for Noor Foods orders"
readme = "README.md"
authors = [
    { name = "Your Name", email = "you@example.com" }
]
requires-python = ">=3.14"
dependencies = [
    "fastapi[standard]>=0.121.0",
]

[build-system]
requires = ["uv_build>=0.9.0,<0.10.0"]
build-backend = "uv_build"

[tool.fastapi]
entrypoint = "orders_api.main:app"
